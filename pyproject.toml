[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: requires Windows runtime resources",
  "packaged: requires a built standalone distribution",
  "performance: measures a recorded performance baseline",
]

[tool.coverage.run]
branch = true
source = ["app_core", "task_workflow", "services"]
omit = [
  "tests/*",
  "app_core/app_runtime_bootstrap.py",
  "app_core/logging_runtime.py",
  "app_core/mouse_runtime.py",
  "app_core/runtime/task_state_manager.py",
  "services/multiprocess_*.py",
  "services/rapidocr_ocr_service.py",
  "services/screenshot_pool.py",
  "task_workflow/card_display.py",
  "task_workflow/card_payload.py",
  "task_workflow/executor.py",
  "task_workflow/media_player.py",
  "task_workflow/multi_thread_session.py",
  "task_workflow/process_proxy.py",
  "task_workflow/process_worker.py",
  "task_workflow/resource_path.py",
  "task_workflow/workflow_context.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
  "venv",
  "build_assets/packaging/build_output",
  "build_assets/packaging/release_output",
  "tools/ibinputsimulator",
]

[tool.ruff.lint]
# Start with correctness rules while the legacy UI is being decomposed.
select = ["E9", "F63", "F7", "F82"]
